# Build and test every pull request inside the project's dev container (see ADR 0005).
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build and test in the dev container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: cmake --workflow --preset debug
